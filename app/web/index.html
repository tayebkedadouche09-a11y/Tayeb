<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tayeb Construction ERP</title><style>
body{font-family:system-ui;margin:0;background:#f5f7fa;color:#17202a}header{background:#17202a;color:white;padding:20px 28px}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001}.metric{font-size:28px;font-weight:700}button{padding:10px 14px;border:0;border-radius:8px;background:#17202a;color:white;cursor:pointer}input{padding:9px;border:1px solid #ccd3da;border-radius:7px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;background:white;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.muted{color:#697586}</style></head>
<body><header><h1>Tayeb Construction ERP</h1><div>Projects · BOQ · Site · Resources · Billing · BIM</div></header><main>
<section class="grid" id="metrics"></section><div class="card" style="margin-top:18px"><h2>Projects</h2><button onclick="newProject()">+ New project</button><div id="projects"></div></div>
</main><script>
const api=p=>fetch('/api'+p); const money=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
async function load(){let d=await (await api('/dashboard')).json();metrics.innerHTML=[['Projects',d.projects],['Active',d.active],['Contract value',money(d.contract_value)],['BOQ value',money(d.boq_value)],['Billed',money(d.billed)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('');
let p=await (await api('/projects')).json();projects.innerHTML='<table><tr><th>Code</th><th>Project</th><th>Client</th><th>Contract</th><th>Status</th></tr>'+p.map(x=>'<tr><td>'+x.code+'</td><td>'+x.name+'</td><td>'+x.client+'</td><td>'+money(x.contract_value)+'</td><td>'+x.status+'</td></tr>').join('')+'</table>'}
async function newProject(){let code=prompt('Project code');if(!code)return;let name=prompt('Project name');if(!name)return;let client=prompt('Client')||'';let value=Number(prompt('Contract value')||0);await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,name,client,contract_value:value})});load()}
load()</script></body></html>
