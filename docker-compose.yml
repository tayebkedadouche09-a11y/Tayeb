services:
  tayeb:
    build: ./app
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      TAYEB_BIM_URL: http://bim-engine:8001
      TAYEB_DB_PATH: /app/data/tayeb.db
      TAYEB_API_TOKEN: ${TAYEB_API_TOKEN:?Set TAYEB_API_TOKEN in .env}
    volumes: ["tayeb_data:/app/data"]
    depends_on: [bim-engine]
  bim-engine:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /srv
    command: sh -c "pip install --no-cache-dir fastapi uvicorn pydantic && uvicorn main:app --host 0.0.0.0 --port 8001"
    volumes: ["./services/bim-engine:/srv"]
volumes:
  tayeb_data:
